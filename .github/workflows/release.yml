name: release

# Builds the downloadable app on a clean GitHub Mac (so no personal paths end up inside it).
#   - Push a tag like v0.1.0  -> builds, then publishes a GitHub Release with the zip.
#   - "Run workflow" button   -> builds only; the zip is attached to the run as an artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Unit tests (core logic)
        run: swift test --package-path Core

      - name: Check translations
        run: python3 scripts/check-strings.py

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen

      - name: Build universal Release app (Apple silicon + Intel)
        run: |
          xcodebuild build -project BreakBar.xcodeproj -scheme BreakBar -configuration Release \
            -derivedDataPath build ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Verify the app
        run: |
          APP=build/Build/Products/Release/BreakBar.app
          ARCHS_FOUND=$(lipo -archs "$APP/Contents/MacOS/BreakBar"); echo "architectures: $ARCHS_FOUND"
          [[ "$ARCHS_FOUND" == *arm64* && "$ARCHS_FOUND" == *x86_64* ]]
          codesign --verify --deep --strict "$APP"
          codesign -d --entitlements - "$APP" 2>&1 | grep -q "com.apple.security.app-sandbox"
          echo "home-directory paths embedded in the binary (expect only the CI runner):"
          strings -a "$APP/Contents/MacOS/BreakBar" | grep -oE "/Users/[A-Za-z0-9_.-]+" | sort -u || true

      - name: Package zip and DMG
        run: |
          APP=build/Build/Products/Release/BreakBar.app
          ditto -c -k --sequesterRsrc --keepParent "$APP" "BreakBar-$VERSION.zip"

          # DMG: the app plus a shortcut to Applications, with our background and icon layout.
          # dmgbuild (in a throwaway virtual environment) writes the Finder layout without needing Finder.
          python3 -m venv .dmgvenv
          .dmgvenv/bin/pip install --quiet dmgbuild==1.6.1
          BG_ARGS=()
          if [[ -f Design/dmg-background@2x.png && -f Design/dmg-background.png ]]; then
            # Retina: combine the 1x and 2x images into one multi-resolution TIFF.
            tiffutil -cathidpicheck Design/dmg-background.png Design/dmg-background@2x.png -out dmg-background.tiff
            BG_ARGS=(-D background=dmg-background.tiff -D size_from=Design/dmg-background.png)
          elif [[ -f Design/dmg-background.png ]]; then
            BG_ARGS=(-D background=Design/dmg-background.png)
          fi
          .dmgvenv/bin/dmgbuild -s packaging/dmg-settings.py -D app="$APP" "${BG_ARGS[@]}" "BreakBar" "BreakBar-$VERSION.dmg"

          # Check the DMG opens and contains the app.
          hdiutil attach "BreakBar-$VERSION.dmg" -mountpoint /tmp/breakbar-dmg -nobrowse -quiet
          test -d /tmp/breakbar-dmg/BreakBar.app
          hdiutil detach /tmp/breakbar-dmg -quiet

          shasum -a 256 "BreakBar-$VERSION.zip" "BreakBar-$VERSION.dmg" | tee "BreakBar-$VERSION.sha256"

      - name: Generate Homebrew cask file
        run: |
          APP=build/Build/Products/Release/BreakBar.app
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Contents/Info.plist")
          SHA=$(shasum -a 256 "BreakBar-$VERSION.zip" | cut -d' ' -f1)
          sed -e "s|@VERSION@|$VERSION|g" -e "s|@SHA256@|$SHA|g" \
              -e "s|@REPO@|$GITHUB_REPOSITORY|g" -e "s|@BUNDLE_ID@|$BUNDLE_ID|g" \
              packaging/breakbar.rb.template > breakbar.rb
          cat breakbar.rb

      - uses: actions/upload-artifact@v4
        with:
          name: BreakBar-${{ env.VERSION }}
          path: |
            BreakBar-${{ env.VERSION }}.zip
            BreakBar-${{ env.VERSION }}.dmg
            BreakBar-${{ env.VERSION }}.sha256
            breakbar.rb

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          **Install:** open the `.dmg` and drag `BreakBar.app` to Applications (or unzip the `.zip`).
          The app is not notarised by Apple, so macOS blocks it on first launch. Click **Done**, then open
          **System Settings → Privacy & Security**, scroll to **Security**, click **Open Anyway** next to
          "BreakBar.app was blocked", and confirm. Or run once in Terminal:
          `xattr -dr com.apple.quarantine /Applications/BreakBar.app`

          Requires macOS 13 or later. Runs on Apple silicon and Intel. `breakbar.rb` is the Homebrew cask file.
          NOTES
          FILES=("BreakBar-$VERSION.zip" "BreakBar-$VERSION.dmg" "BreakBar-$VERSION.sha256" breakbar.rb)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # You already created this release on the website: keep your title and notes, add the files.
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            FLAGS=""; [[ "$VERSION" == *-* ]] && FLAGS="--prerelease"
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --title "BreakBar $VERSION" --notes-file notes.md --generate-notes $FLAGS
          fi
