# XcodeGen spec. Run `xcodegen` in this folder to produce BreakBar.xcodeproj.
name: BreakBar
options:
  bundleIdPrefix: com.12amcoffee
  developmentLanguage: en
  deploymentTarget:
    macOS: "13.0"
packages:
  BreakBarCore:
    path: Core
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
targets:
  BreakBar:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: BreakBarCore
      - package: KeyboardShortcuts
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BreakBar
        CFBundleShortVersionString: $(MARKETING_VERSION)   # XcodeGen would otherwise write a fixed "1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, zh-Hans, ja]
        CFBundleURLTypes:
          - CFBundleURLName: com.12amcoffee.BreakBar
            CFBundleURLSchemes: [breakbar]
        LSUIElement: true              # menu bar only, no Dock icon
        LSApplicationCategoryType: public.app-category.productivity
    entitlements:
      path: App/BreakBar.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.12amcoffee.BreakBar
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"        # "Sign to Run Locally": no Apple developer account needed
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
